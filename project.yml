name: CheckMate
options:
  bundleIdPrefix: com.checkmate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CheckMate uses your location to show nearby VCs on the map and point the compass toward the nearest accelerator."
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "CheckMate uses your location to show nearby VCs on the map and point the compass toward the nearest accelerator."
targets:
  CheckMate:
    type: application
    platform: iOS
    sources:
      - path: CheckMate
        excludes:
          - Resources
          - vc_locations.json
    resources:
      - path: CheckMate/vc_locations.json
    preBuildScripts:
      - name: Copy VC Data
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}"
          cp "${SRCROOT}/CheckMate/vc_locations.json" "${DEST}/vc_locations.json"
          rm -rf "${DEST}/Logos"
          cp -R "${SRCROOT}/CheckMate/Resources/Logos" "${DEST}/Logos"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checkmate.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CheckMate
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CheckMate uses your location to show nearby VCs on the map and point the compass toward the nearest accelerator."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
